name: Verify MoE fidelity branch

on:
  push:
    branches:
      - fix/moe-real-gpu-fidelity

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract Go version
        run: sed -En 's/^go (.*)$/GO_VERSION=\1/p' go.mod >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache-dependency-path: go.sum
      - name: Apply gofmt through GitHub Contents API
        id: formatting
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          files=$(git diff --name-only origin/main...HEAD -- '*.go')
          bad=$(gofmt -l $files)
          if [ -z "$bad" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gofmt -w $bad
          export BAD_FILES="$bad"
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]
          files = os.environ["BAD_FILES"].split()
          identity = {
              "name": "Zibin Chen",
              "email": "49872411+chenzibin2019@users.noreply.github.com",
          }
          for path in files:
              quoted = urllib.parse.quote(path, safe="/")
              get_url = f"https://api.github.com/repos/{repo}/contents/{quoted}?ref={urllib.parse.quote(branch, safe='')}"
              req = urllib.request.Request(get_url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req) as response:
                  metadata = json.load(response)
              with open(path, "rb") as f:
                  content = base64.b64encode(f.read()).decode("ascii")
              payload = json.dumps({
                  "message": "Format MoE fidelity code\n\nSigned-off-by: Zibin Chen <49872411+chenzibin2019@users.noreply.github.com>",
                  "content": content,
                  "sha": metadata["sha"],
                  "branch": branch,
                  "author": identity,
                  "committer": identity,
              }).encode("utf-8")
              put = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/contents/{quoted}",
                  data=payload,
                  method="PUT",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(put) as response:
                  result = json.load(response)
              print(path, result["commit"]["sha"])
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Check go.mod and go.sum
        if: steps.formatting.outputs.changed != 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go vet
        if: steps.formatting.outputs.changed != 'true'
        run: go vet ./pkg/simulator ./scripts/moe_trace_virtual_benchmark
      - name: Simulator tests
        if: steps.formatting.outputs.changed != 'true'
        run: go test ./pkg/simulator
      - name: Virtual benchmark build
        if: steps.formatting.outputs.changed != 'true'
        run: go test ./scripts/moe_trace_virtual_benchmark

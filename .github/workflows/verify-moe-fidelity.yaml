name: Verify MoE fidelity branch

on:
  push:
    branches:
      - fix/moe-real-gpu-fidelity

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract Go version
        run: sed -En 's/^go (.*)$/GO_VERSION=\1/p' go.mod >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          files=$(git diff --name-only origin/main...HEAD -- '*.go')
          test -z "$(gofmt -l $files)"
      - name: Go vet
        run: go vet ./pkg/simulator ./scripts/moe_trace_virtual_benchmark
      - name: Simulator tests
        run: go test ./pkg/simulator
      - name: Virtual benchmark build
        run: go test ./scripts/moe_trace_virtual_benchmark

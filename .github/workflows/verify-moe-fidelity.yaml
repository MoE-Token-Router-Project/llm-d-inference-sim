name: Verify MoE fidelity branch

on:
  push:
    branches:
      - fix/moe-real-gpu-fidelity

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract Go version
        run: sed -En 's/^go (.*)$/GO_VERSION=\1/p' go.mod >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache-dependency-path: go.sum
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: |
          files=$(git diff --name-only origin/main...HEAD -- '*.go')
          bad=$(gofmt -l $files)
          if [ -n "$bad" ]; then
            for file in $bad; do
              echo "::error file=$file::gofmt required"
            done
            exit 1
          fi
      - name: Go vet
        if: always()
        run: go vet ./pkg/simulator ./scripts/moe_trace_virtual_benchmark
      - name: Simulator tests
        if: always()
        run: go test ./pkg/simulator
      - name: Virtual benchmark build
        if: always()
        run: go test ./scripts/moe_trace_virtual_benchmark
      - name: Fail if formatting failed
        if: steps.formatting.outcome == 'failure'
        run: exit 1
